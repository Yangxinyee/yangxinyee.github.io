name: Build Chinese homepage

on:
  push:
    branches: [main]
    paths:
      - index.html
      - js/i18n.js
      - scripts/build_zh.mjs
      - .github/workflows/build-zh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-zh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jsdom
        run: npm install --no-save jsdom@24

      - name: Generate zh/index.html
        run: node scripts/build_zh.mjs

      - name: Commit changed page
        run: |
          if git diff --quiet -- zh/index.html; then
            echo "zh/index.html is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zh/index.html
          git commit -m "Regenerate Chinese homepage (zh/index.html)"
          git push
